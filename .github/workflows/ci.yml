name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Em-dash check (MDX)
        run: npm run check-em-dashes

      - name: Schema-drift check (migrations vs schema.ts)
        run: npm run check-schema-drift

      - name: Test (with coverage summary)
        run: npm run test:coverage

      # Advisory-Gate statt `npm audit --audit-level=high`: ein globaler
      # Severity-Schwellwert kann nur „wie schlimm" ausdrücken, nicht „gesichtet
      # und kein Fix erreichbar", und war deshalb nach der Hochstufung der
      # postcss-/sharp-Advisories dauerhaft rot. Die Entscheidungen stehen
      # deklarativ in scripts/advisory-policy.json; das Gate wird rot bei einem
      # neuen ungesichteten Advisory, bei verstrichener Sichtungsfrist und bei
      # einer gegenstandslosen Ausnahme. Begründung im Kopf von
      # scripts/check-advisories.mjs. Bleibt required, kein continue-on-error.
      - name: Advisory gate
        run: npm run check-advisories
